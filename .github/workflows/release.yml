name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run spellcheck
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  release:
    runs-on: ubuntu-latest
    needs: gate
    environment: dev
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Build dist/cli.js
        run: npm run build
      - name: Publish to npm (via Trusted Publisher / OIDC)
        # No NODE_AUTH_TOKEN — npm exchanges GitHub's OIDC token for a
        # short-lived publish token via the trusted-publisher config on
        # npmjs.com. See /package/github-mcp-server-js/access.
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --tag next --provenance --access public
          else
            npm publish --provenance --access public
          fi
      - name: Pack .mcpb bundle
        run: npm run pack:mcpb
      - name: Upload .mcpb + .zip to the tag's GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/github-mcp-server-js-*.mcpb
            dist/github-mcp-server-js-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
